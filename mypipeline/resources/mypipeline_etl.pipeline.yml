# The main pipeline for mypipeline

resources:
  pipelines:
    mypipeline_etl:
      name: mypipeline_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/mypipeline_etl"

      libraries:
        - glob:
            include: ../src/mypipeline_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
